<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction item</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article style="width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 4px; font-family: Roboto, system-ui, sans-serif; background: var(--canvas); color: var(--text)">
  <div class="is-secondary" style="display: flex; justify-content: space-between; gap: 8px; font-size: var(--type-body-sm-size); line-height: var(--type-body-sm-line)">
    <span>{{time}}</span>
    <span>{{category}}</span>
  </div>
  <span style="font-size: var(--type-title-size); line-height: var(--type-title-line); font-weight: 700; color: {{color}}">{{amount}}</span>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["income","expense"],"default":"expense"},"time":{"editor":"text","default":"02:15 PM"},"category":{"editor":"text","default":"Food"},"amount":{"editor":"text","default":"€42.00"},"$preview":{"width":328,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var income = this.props.kind === 'income';
    return {
      color: income ? 'var(--income)' : 'var(--expense)',
      time: this.props.time ?? '02:15 PM',
      category: this.props.category ?? 'Food',
      amount: (income ? '+' : '−') + (this.props.amount ?? '€42.00')
    };
  }
}
</script>
</body>
</html>
