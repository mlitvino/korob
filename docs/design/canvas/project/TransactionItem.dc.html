<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction item</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article role="{{role}}" aria-checked="{{checked}}" style="position: relative; width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px; font-family: Roboto, system-ui, sans-serif; background: {{bg}}; color: var(--text)">
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <span style="font-size: var(--type-body-sm-size); line-height: var(--type-body-sm-line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{category}}</span>
    <span class="is-secondary" style="font-size: var(--type-caption-size); line-height: var(--type-caption-line)">{{time}}</span>
  </div>
  <span style="font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 700; color: {{color}}">{{amount}}</span>
  <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 2px solid {{boxBorder}}; background: {{boxFill}}; color: var(--on-action-primary)"><sc-if value="{{checkedOn}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg></sc-if></span>
  </sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{ false }}">
    <a href="{{href}}" aria-label="{{category}} {{amount}}" style="position: absolute; inset: 0; border-radius: var(--radius-sm)"></a>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["income","expense"],"default":"expense"},"time":{"editor":"text","default":"02:15 PM"},"category":{"editor":"text","default":"Food"},"amount":{"editor":"text","default":"€42.00"},"selecting":{"editor":"boolean","default":false},"selected":{"editor":"boolean","default":false},"href":{"editor":null,"default":""},"$preview":{"width":328,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    var income = this.props.kind === 'income';
    return {
      color: income ? 'var(--income)' : 'var(--expense)',
      time: this.props.time ?? '02:15 PM',
      category: this.props.category ?? 'Food',
      amount: (income ? '+' : '−') + (this.props.amount ?? '€42.00'),
      // selection mode: a checkbox on the right; the row links nowhere (a tap toggles it in the app)
      selecting: !!this.props.selecting, checkedOn: !!this.props.selecting && !!this.props.selected,
      role: this.props.selecting ? 'checkbox' : 'article',
      checked: this.props.selecting ? String(!!this.props.selected) : null,
      bg: this.props.selecting && this.props.selected ? 'var(--inset)' : 'var(--canvas)',
      boxBorder: this.props.selecting && this.props.selected ? 'var(--selection)' : 'var(--outline)',
      boxFill: this.props.selecting && this.props.selected ? 'var(--selection)' : 'transparent',
      href: this.props.selecting ? '' : (this.props.href || ''), hasHref: !this.props.selecting && !!this.props.href
    };
  }
}
</script>
</body>
</html>
