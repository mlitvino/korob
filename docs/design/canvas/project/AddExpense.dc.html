<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Add Transaction</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="back" title="{{s.title}}" href="Main.dc.html" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; justify-content: center; gap: 20px">
    <h2 style="margin: 0; text-align: center; font-size: var(--type-headline-size); line-height: var(--type-headline-line); font-weight: 700">{{s.heading}}</h2>
    <form style="display: flex; flex-direction: column; gap: 20px">
      <dc-import name="FieldInput" state="focused" label="{{s.amount}}" placeholder="{{s.enterAmount}}" error="{{s.amountError}}" hint-size="100%,64px"></dc-import>
      <dc-import name="FieldPicker" label="{{s.category}}" value="{{category}}" href="{{pickerHref}}" hint-size="100%,64px"></dc-import>
      <div style="display: flex; gap: 8px">
        <div style="flex: 1; min-width: 0">
          <dc-import name="FieldPicker" label="{{s.date}}" value="{{date}}" href="DatePicker.dc.html" hint-size="100%,64px"></dc-import>
        </div>
        <div style="width: 136px; flex: none">
          <dc-import name="FieldPicker" label="{{s.time}}" value="{{time}}" href="TimePicker.dc.html" hint-size="100%,64px"></dc-import>
        </div>
      </div>
      <dc-import name="FieldInput" label="{{cm.label}}" placeholder="{{cm.placeholder}}" value="{{cm.value}}" multiline="{{ true }}" max-length="500" hint-size="100%,108px"></dc-import>
      <dc-import name="Button" variant="primary" size="lg" state="{{doneState}}" label="{{s.done}}" href="Main.dc.html" hint-size="100%,56px"></dc-import>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["expense","income"],"default":"expense"},"theme":{"editor":"enum","options":["global","dark","light","black","black_yellow"],"default":"global"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"categories":{"editor":"enum","options":["some","none"],"default":"some"},"comment":{"editor":"enum","options":["filled","empty"],"default":"filled"},"amount":{"editor":"enum","options":["empty","error"],"default":"empty"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
var STR = {
  en: { addExpense: 'Add expense', addIncome: 'Add income', expense: 'Expense', income: 'Income', amount: 'Amount', enterAmount: 'Enter amount', amountRequired: 'Enter an amount', category: 'Category', date: 'Date', time: 'Time', done: 'Done', food: 'Food', salary: 'Salary', noCategories: 'No categories' },
  fi: { addExpense: 'Lisää meno', addIncome: 'Lisää tulo', expense: 'Menot', income: 'Tulot', amount: 'Summa', enterAmount: 'Syötä summa', amountRequired: 'Anna summa', category: 'Kategoria', date: 'Päivä', time: 'Aika', done: 'Valmis', food: 'Ruoka', salary: 'Palkka', noCategories: 'Ei kategorioita' },
  ru: { addExpense: 'Добавить расход', addIncome: 'Добавить доход', expense: 'Расходы', income: 'Доходы', amount: 'Сумма', enterAmount: 'Введите сумму', amountRequired: 'Укажите сумму', category: 'Категория', date: 'Дата', time: 'Время', done: 'Готово', food: 'Еда', salary: 'Зарплата', noCategories: 'Нет категорий' }
};
var CSTR = {
  en: { comment: 'Comment', optional: 'Optional', save: 'Save', sample: 'Lunch with Anna at the market. Paid for both, she owes me half.' },
  fi: { comment: 'Kommentti', optional: 'Valinnainen', save: 'Tallenna', sample: 'Lounas Annan kanssa torilla. Maksoin molempien puolesta, hän on velkaa puolet.' },
  ru: { comment: 'Комментарий', optional: 'Необязательно', save: 'Сохранить', sample: 'Обед с Анной на рынке. Заплатил за двоих, она должна половину.' }
};
function pad(n) { return String(n).padStart(2, '0'); }
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = STR[p.lang] ? p.lang : 'en';
    var t = STR[lang];
    var income = p.kind === 'income';
    var none = p.categories === 'none';
    var now = new Date(), h = now.getHours(), m = pad(now.getMinutes());
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      s: {
        title: income ? t.addIncome : t.addExpense, heading: income ? t.income : t.expense,
        amount: t.amount, enterAmount: t.enterAmount, amountError: p.amount === 'error' ? t.amountRequired : '', category: t.category, date: t.date, time: t.time, done: t.done
      },
      cm: (function () { var cs = CSTR[lang] || CSTR.en;
        return { label: cs.comment, placeholder: cs.optional, value: p.comment === 'empty' ? '' : cs.sample, save: cs.save }; })(),
      doneState: none ? 'disabled' : 'default',
      category: none ? t.noCategories : (income ? t.salary : t.food),
      pickerHref: income ? 'IncomeCategoryPicker.dc.html' : 'CategoryPicker.dc.html',
      date: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()),
      time: lang === 'en' ? pad(h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM') : pad(h) + ':' + m
    };
  }
}
</script>
</body>
</html>
