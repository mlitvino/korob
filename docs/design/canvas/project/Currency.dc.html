<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Currency</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="back" title="{{s.title}}" href="Settings.dc.html" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column">
    <dc-import name="SettingsRow" variant="option" position="first" selected="{{ true }}" label="{{s.eur}}" hint-size="100%,56px"></dc-import>
    <dc-import name="SettingsRow" variant="option" position="last" selected="{{ false }}" label="{{s.usd}}" hint-size="100%,56px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","black","black_yellow"],"default":"dark"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var STR = {
  en: { title: 'Currency', eur: 'Euro (EUR)', usd: 'US Dollar (USD)' },
  fi: { title: 'Valuutta', eur: 'Euro (EUR)', usd: 'Yhdysvaltain dollari (USD)' },
  ru: { title: 'Валюта', eur: 'Евро (EUR)', usd: 'Доллар США (USD)' }
};
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      theme: ['dark', 'light', 'black', 'black_yellow'].indexOf(p.theme) >= 0 ? p.theme : 'dark',
      s: STR[p.lang] || STR.en,
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1'
    };
  }
}
</script>
</body>
</html>
