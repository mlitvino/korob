<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Startup error</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; box-sizing: border-box; padding: var(--gutter); display: flex; flex-direction: column; justify-content: center; gap: var(--spacing-lg); overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <h1 style="margin: 0; font-size: var(--type-headline-size); line-height: var(--type-headline-line); font-weight: 700">{{s.title}}</h1>
  <p class="is-secondary" style="margin: 0; font-size: var(--type-body-size); line-height: var(--type-body-line)">{{s.message}}</p>
  <dc-import name="Button" variant="primary" size="lg" icon="" label="{{s.retry}}" href="Loading.dc.html" hint-size="100%,56px"></dc-import>
  <p class="is-secondary" style="margin: 0; font-size: var(--type-caption-size); line-height: var(--type-caption-line)">{{error}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["global","dark","light","black","black_yellow"],"default":"global"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
// Same texts as startupError.* in frontend/src/locales; the last line is a sample error message.
var STR = {
  en: { title: "Couldn't open your data", message: "The app couldn't read its data. Try again, or restart the app.", retry: 'Try again' },
  fi: { title: 'Tietoja ei voitu avata', message: 'Sovellus ei voinut lukea tietojaan. Yritä uudelleen tai käynnistä sovellus uudelleen.', retry: 'Yritä uudelleen' },
  ru: { title: 'Не удалось открыть данные', message: 'Приложение не смогло прочитать свои данные. Повторите попытку или перезапустите приложение.', retry: 'Повторить' }
};
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = STR[p.lang] ? p.lang : 'en';
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      lang: lang, s: STR[lang], error: 'disk I/O error',
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1'
    };
  }
}
</script>
</body>
</html>
