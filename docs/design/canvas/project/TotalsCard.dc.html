<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Totals card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Totals" style="width: 100%; box-sizing: border-box; border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; font-family: Roboto, system-ui, sans-serif; background: var(--surface); color: var(--text)">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--separator)">
    <span style="flex: 0.7; min-width: 0"></span>
    <h2 style="flex: 1; min-width: 0; margin: 0; text-align: center; font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600">{{incomeTitle}}</h2>
    <h2 style="flex: 1; min-width: 0; margin: 0; text-align: center; font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600">{{expenseTitle}}</h2>
  </div>
  <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: {{row.divider}}">
      <span style="flex: 0.7; min-width: 0; font-size: var(--type-body-size); line-height: var(--type-body-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.label}}</span>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.income}}</span>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.expense}}</span>
    </div>
  </sc-for>
  <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
    <span class="is-secondary" style="padding: 0 16px 12px; text-align: center; font-size: var(--type-caption-size); line-height: var(--type-caption-line)">{{note}}</span>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"monthIncome":{"editor":null,"default":285000},"monthExpense":{"editor":null,"default":119200},"weekIncome":{"editor":null,"default":35000},"weekExpense":{"editor":null,"default":10500},"dayIncome":{"editor":null,"default":0},"dayExpense":{"editor":null,"default":4200},"rates":{"editor":"enum","options":["same","missing"],"default":"same"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"$preview":{"width":328,"height":220}}'>
var LOCALE = { en: 'en-US', fi: 'fi-FI', ru: 'ru-RU' };
var STR = {
  en: ['Income', 'Expense', 'Month', 'Week', 'Day'],
  fi: ['Tulot', 'Menot', 'Kuukausi', 'Viikko', 'Päivä'],
  ru: ['Доходы', 'Расходы', 'Месяц', 'Неделя', 'День']
};
var NOTE = {
  en: 'USD not counted: no exchange rate yet',
  fi: 'USD ei mukana: ei vielä vaihtokurssia',
  ru: 'USD не учтены: нет курса'
};
function money(cents, lang) {
  return new Intl.NumberFormat(LOCALE[lang], { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 }).format(cents / 100);
}
class Component extends DCLogic {
  renderVals() {
    var lang = STR[this.props.lang] ? this.props.lang : 'en';
    var s = STR[lang];
    var p = this.props;
    var line = '1px solid var(--separator)';
    return {
      incomeTitle: s[0],
      expenseTitle: s[1],
      rows: [
        { label: s[2], income: money(p.monthIncome ?? 285000, lang), expense: money(p.monthExpense ?? 119200, lang), divider: 'none' },
        { label: s[3], income: money(p.weekIncome ?? 35000, lang), expense: money(p.weekExpense ?? 10500, lang), divider: line },
        { label: s[4], income: money(p.dayIncome ?? 0, lang), expense: money(p.dayExpense ?? 4200, lang), divider: line }
      ],
      hasNote: p.rates === 'missing',
      note: NOTE[lang]
    };
  }
}
</script>
</body>
</html>
