<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Totals card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Totals" style="width: 100%; box-sizing: border-box; border-radius: var(--radius-md); overflow: hidden; display: flex; font-family: Roboto, system-ui, sans-serif; background: var(--surface); color: var(--text)">
  <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; border-left: {{col.divider}}">
      <h2 style="margin: 0; padding: 12px 16px; font-size: var(--type-title-size); line-height: var(--type-title-line); font-weight: 600; border-bottom: 1px solid var(--separator)">{{col.title}}</h2>
      <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: var(--type-body-size); line-height: var(--type-body-line)">{{allTime}}</span>
        <span style="font-size: var(--type-headline-size); line-height: var(--type-headline-line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{col.amount}}</span>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"income":{"editor":null,"default":285000},"expense":{"editor":null,"default":119200},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"$preview":{"width":328,"height":144}}'>
var LOCALE = { en: 'en-US', fi: 'fi-FI', ru: 'ru-RU' };
var STR = {
  en: ['Income', 'Expense', 'all-time'],
  fi: ['Tulot', 'Menot', 'kaikki ajat'],
  ru: ['Доходы', 'Расходы', 'за всё время']
};
function money(cents, lang) {
  return new Intl.NumberFormat(LOCALE[lang], { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 }).format(cents / 100);
}
class Component extends DCLogic {
  renderVals() {
    var lang = STR[this.props.lang] ? this.props.lang : 'en';
    var s = STR[lang];
    return {
      allTime: s[2],
      cols: [
        { title: s[0], amount: money(this.props.income ?? 285000, lang), divider: 'none' },
        { title: s[1], amount: money(this.props.expense ?? 119200, lang), divider: '1px solid var(--separator)' }
      ]
    };
  }
}
</script>
</body>
</html>
