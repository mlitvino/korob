<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; font-family: Roboto, system-ui, sans-serif; color: var(--text)">
  <button type="button" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 8px 8px 8px 16px; border-radius: var(--radius-sm); border: 2px solid transparent; display: flex; align-items: center; gap: 8px; text-align: left; font-family: inherit; background: var(--inset); color: inherit">
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span class="is-secondary" style="font-size: var(--type-caption-size); line-height: var(--type-caption-line)">{{label}}</span>
      <span style="font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{value}}</span>
    </span>
    <svg class="is-secondary" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="M7 10l5 5 5-5z"></path></svg>
  </button>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{ false }}">
    <a href="{{href}}" aria-label="{{label}}" style="position: absolute; inset: 0; border-radius: var(--radius-sm)"></a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Category"},"value":{"editor":"text","default":"Food"},"href":{"editor":null,"default":""},"$preview":{"width":328,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      href: this.props.href || '', hasHref: !!this.props.href,
      label: this.props.label ?? 'Category',
      value: this.props.value ?? 'Food'
    };
  }
}
</script>
</body>
</html>
