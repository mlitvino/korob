<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circle button</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{size}}px; height: {{size}}px">
<button type="button" class="{{stateClass}}" aria-label="{{label}}" style="width: {{size}}px; height: {{size}}px; padding: 0; border: 0; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-family: Roboto, system-ui, sans-serif; background: {{bg}}; color: var(--contrast-text)">
  <sc-if value="{{isIncome}}" hint-placeholder-val="{{ true }}">
    <svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
  </sc-if>
  <sc-if value="{{isExpense}}" hint-placeholder-val="{{ false }}">
    <svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13H5v-2h14v2z"></path></svg>
  </sc-if>
</button>
<sc-if value="{{hasHref}}" hint-placeholder-val="{{ false }}">
  <a href="{{href}}" aria-label="{{label}}" style="position: absolute; inset: 0; border-radius: var(--radius-full)"></a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["income","expense"],"default":"income"},"size":{"editor":"enum","options":["md","lg"],"default":"lg"},"state":{"editor":"enum","options":["default","pressed","disabled"],"default":"default"},"href":{"editor":null,"default":""},"$preview":{"width":80,"height":80}}'>
var STATE = { default: '', pressed: 'is-pressed', disabled: 'is-disabled' };
class Component extends DCLogic {
  renderVals() {
    var kind = this.props.kind === 'expense' ? 'expense' : 'income';
    var lg = (this.props.size ?? 'lg') === 'lg';
    return {
      bg: 'var(--' + kind + ')',
      size: lg ? 80 : 64, icon: lg ? 40 : 32,
      stateClass: STATE[this.props.state] || '',
      href: this.props.href || '', hasHref: !!this.props.href,
      isIncome: kind === 'income', isExpense: kind === 'expense',
      label: kind === 'income' ? 'Add income' : 'Add expense'
    };
  }
}
</script>
</body>
</html>
