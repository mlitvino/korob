<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Transactions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="drawer" title="{{title}}" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <dc-import name="TransactionFilterBar" filter="all" lang="{{lang}}" hint-size="100%,48px"></dc-import>
    <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
        <dc-import name="TransactionDateSeparator" label="{{row.date}}" hint-size="100%,24px"></dc-import>
        <dc-import name="TransactionItem" kind="{{row.kind}}" time="{{row.time}}" category="{{row.category}}" amount="{{row.amount}}" hint-size="100%,76px"></dc-import>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["global","dark","light","black","black_yellow"],"default":"global"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
var LOCALE = { en: 'en-US', fi: 'fi-FI', ru: 'ru-RU' };
var TITLE = { en: 'Transactions', fi: 'Tapahtumat', ru: 'Транзакции' };
var CAT = {
  en: { salary: 'Salary', freelance: 'Freelance', food: 'Food', transport: 'Transport', housing: 'Housing', entertainment: 'Entertainment', shopping: 'Shopping' },
  fi: { salary: 'Palkka', freelance: 'Freelance', food: 'Ruoka', transport: 'Liikenne', housing: 'Asuminen', entertainment: 'Viihde', shopping: 'Ostokset' },
  ru: { salary: 'Зарплата', freelance: 'Фриланс', food: 'Еда', transport: 'Транспорт', housing: 'Жильё', entertainment: 'Развлечения', shopping: 'Покупки' }
};
// Seed data from frontend/src/features/debug/mockTransactions.ts: [days ago, type, category, cents], newest first.
var SEED = [[2, 'expense', 'food', 4200], [5, 'expense', 'shopping', 12000], [8, 'expense', 'entertainment', 2500], [12, 'expense', 'transport', 4000], [15, 'expense', 'food', 6500], [20, 'income', 'freelance', 35000], [27, 'expense', 'housing', 90000], [28, 'income', 'salary', 250000]];
function pad(n) { return String(n).padStart(2, '0'); }
function time(d, lang) {
  var h = d.getHours(), m = pad(d.getMinutes());
  return lang === 'en' ? pad(h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM') : pad(h) + ':' + m;
}
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = TITLE[p.lang] ? p.lang : 'en';
    var money = new Intl.NumberFormat(LOCALE[lang], { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      lang: lang, title: TITLE[lang],
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      rows: SEED.map(function (t) {
        var d = new Date(Date.now() - t[0] * 864e5);
        return {
          date: d.toLocaleDateString(LOCALE[lang], { weekday: 'short', day: '2-digit', month: 'short' }),
          time: time(d, lang), kind: t[1], category: CAT[lang][t[2]], amount: money.format(t[3] / 100)
        };
      })
    };
  }
}
</script>
</body>
</html>
