<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Transactions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="{{headerVariant}}" title="{{headerTitle}}" lang="{{lang}}" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <dc-import name="TransactionPeriodBar" mode="{{period}}" lang="{{lang}}" hint-size="100%,40px"></dc-import>
    <dc-import name="TransactionFilterBar" filter="all" lang="{{lang}}" hint-size="100%,40px"></dc-import>
    <dc-import name="TransactionPeriodTotals" income="{{income}}" expense="{{expense}}" lang="{{lang}}" hint-size="100%,36px"></dc-import>
    <div aria-hidden="true" style="flex: none; height: 2px; background: var(--separator)"></div>
    <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
        <dc-import name="TransactionDateSeparator" label="{{row.date}}" hint-size="100%,20px"></dc-import>
        <dc-import name="TransactionItem" kind="{{row.kind}}" time="{{row.time}}" category="{{row.category}}" amount="{{row.amount}}" selecting="{{selecting}}" selected="{{row.selected}}" href="TransactionDetails.dc.html" hint-size="100%,52px"></dc-import>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div class="is-secondary" style="padding-top: 20px; text-align: center; font-size: var(--type-body-size); line-height: var(--type-body-line)">{{emptyText}}</div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;global&quot;,&quot;dark&quot;,&quot;light&quot;,&quot;black&quot;,&quot;black_yellow&quot;],&quot;default&quot;:&quot;global&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;fi&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;en&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;412&quot;,&quot;360&quot;],&quot;default&quot;:&quot;412&quot;},&quot;fontScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;1.3&quot;],&quot;default&quot;:&quot;1&quot;},&quot;period&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;day&quot;,&quot;week&quot;,&quot;month&quot;,&quot;year&quot;,&quot;all&quot;,&quot;range&quot;],&quot;default&quot;:&quot;all&quot;},&quot;transactions&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;some&quot;,&quot;none&quot;],&quot;default&quot;:&quot;some&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;selecting&quot;],&quot;default&quot;:&quot;normal&quot;},&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:892}}">
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
var LOCALE = { en: 'en-US', fi: 'fi-FI', ru: 'ru-RU' };
var TITLE = { en: 'Transactions', fi: 'Tapahtumat', ru: 'Транзакции' };
var EMPTY = { en: 'No transactions in this period', fi: 'Ei tapahtumia tällä jaksolla', ru: 'Нет транзакций за этот период' };
var CAT = {
  en: { salary: 'Salary', freelance: 'Freelance', food: 'Food', transport: 'Transport', housing: 'Housing', entertainment: 'Entertainment', shopping: 'Shopping' },
  fi: { salary: 'Palkka', freelance: 'Freelance', food: 'Ruoka', transport: 'Liikenne', housing: 'Asuminen', entertainment: 'Viihde', shopping: 'Ostokset' },
  ru: { salary: 'Зарплата', freelance: 'Фриланс', food: 'Еда', transport: 'Транспорт', housing: 'Жильё', entertainment: 'Развлечения', shopping: 'Покупки' }
};
// Seed data from frontend/src/features/debug/mockTransactions.ts: [days ago, type, category, cents], newest first.
var SEED = [[2, 'expense', 'food', 4200], [5, 'expense', 'shopping', 12000], [8, 'expense', 'entertainment', 2500], [12, 'expense', 'transport', 4000], [15, 'expense', 'food', 6500], [20, 'income', 'freelance', 35000], [27, 'expense', 'housing', 90000], [28, 'income', 'salary', 250000]];
// long-press a row to select; rows 1, 3 and 4 shown selected
var PICKED = [0, 2, 3];
var COUNT = { en: function (n) { return n + ' selected'; }, fi: function (n) { return n + ' valittu'; }, ru: function (n) { return 'Выбрано: ' + n; } };
function pad(n) { return String(n).padStart(2, '0'); }
function time(d, lang) {
  var h = d.getHours(), m = pad(d.getMinutes());
  return lang === 'en' ? pad(h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM') : pad(h) + ':' + m;
}
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = TITLE[p.lang] ? p.lang : 'en';
    var money = new Intl.NumberFormat(LOCALE[lang], { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
    var none = p.transactions === 'none';
    var total = function (type) {
      return (none ? [] : SEED).reduce(function (sum, t) { return t[1] === type ? sum + t[3] : sum; }, 0);
    };
    return {
      period: p.period || 'all',
      income: total('income'),
      expense: total('expense'),
      empty: none, emptyText: EMPTY[lang],
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      lang: lang, title: TITLE[lang],
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      selecting: p.mode === 'selecting',
      headerVariant: p.mode === 'selecting' ? 'selection' : 'drawer',
      headerTitle: p.mode === 'selecting' ? COUNT[lang](PICKED.length) : TITLE[lang],
      rows: (none ? [] : SEED).map(function (t, i) {
        var d = new Date(Date.now() - t[0] * 864e5);
        return {
          date: d.toLocaleDateString(LOCALE[lang], { weekday: 'short', day: '2-digit', month: 'short' }),
          time: time(d, lang), kind: t[1], category: CAT[lang][t[2]], amount: money.format(t[3] / 100),
          selected: p.mode === 'selecting' && PICKED.indexOf(i) >= 0
        };
      })
    };
  }
}
</script>
</body>
</html>
