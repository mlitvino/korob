<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="drawer" title="{{s.title}}" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column">
    <dc-import name="SettingsRow" variant="value" position="first" label="{{s.currency}}" value="EUR" href="Currency.dc.html" hint-size="100%,56px"></dc-import>
    <dc-import name="SettingsRow" variant="value" position="middle" label="{{s.appearance}}" value="{{themeName}}" href="Appearance.dc.html" hint-size="100%,56px"></dc-import>
    <dc-import name="SettingsRow" variant="value" position="last" label="{{s.language}}" value="{{langName}}" href="Language.dc.html" hint-size="100%,56px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;,&quot;black&quot;,&quot;black_yellow&quot;],&quot;default&quot;:&quot;dark&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;fi&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;en&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;412&quot;,&quot;360&quot;],&quot;default&quot;:&quot;412&quot;},&quot;fontScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;1.3&quot;],&quot;default&quot;:&quot;1&quot;},&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:892}}">
var STR = {
  en: { title: 'Settings', currency: 'Currency', appearance: 'Appearance', language: 'Language', dark: 'Dark', light: 'Light', black: 'Black', black_yellow: 'Black Yellow' },
  fi: { title: 'Asetukset', currency: 'Valuutta', appearance: 'Ulkoasu', language: 'Kieli', dark: 'Tumma', light: 'Vaalea', black: 'Musta', black_yellow: 'Musta-keltainen' },
  ru: { title: 'Настройки', currency: 'Валюта', appearance: 'Оформление', language: 'Язык', dark: 'Тёмная', light: 'Светлая', black: 'Чёрная', black_yellow: 'Чёрно-жёлтая' }
};
var LANG_NAME = { en: 'English', fi: 'Suomi', ru: 'Русский' };
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var lang = STR[p.lang] ? p.lang : 'en';
    var theme = ['dark', 'light', 'black', 'black_yellow'].indexOf(p.theme) >= 0 ? p.theme : 'dark';
    return {
      theme: theme, s: STR[lang], themeName: STR[lang][theme], langName: LANG_NAME[lang],
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1'
    };
  }
}
</script>
</body>
</html>
