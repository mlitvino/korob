<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Categories</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="back" title="{{s.title}}" href="Settings.dc.html" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="is-secondary" style="margin: 0; font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: 600; text-transform: uppercase">{{s.income}}</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{income}}" as="c" hint-placeholder-count="5">
          <div style="max-width: 100%; min-width: 0; display: flex">
            <dc-import name="CategoryChip" label="{{c.label}}" lang="{{lang}}" href="CategoryEditor.dc.html" hint-size="auto,48px"></dc-import>
          </div>
        </sc-for>
        <div style="max-width: 100%; min-width: 0; display: flex">
          <dc-import name="CategoryChip" variant="add" lang="{{lang}}" href="CategoryEditor.dc.html" hint-size="auto,48px"></dc-import>
        </div>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="is-secondary" style="margin: 0; font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: 600; text-transform: uppercase">{{s.expense}}</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{expense}}" as="c" hint-placeholder-count="5">
          <div style="max-width: 100%; min-width: 0; display: flex">
            <dc-import name="CategoryChip" label="{{c.label}}" lang="{{lang}}" href="CategoryEditor.dc.html" hint-size="auto,48px"></dc-import>
          </div>
        </sc-for>
        <div style="max-width: 100%; min-width: 0; display: flex">
          <dc-import name="CategoryChip" variant="add" lang="{{lang}}" href="CategoryEditor.dc.html" hint-size="auto,48px"></dc-import>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["global","dark","light","black","black_yellow"],"default":"global"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
var KEYS = {
  income: ['salary', 'freelance', 'gift', 'investment', 'other'],
  expense: ['food', 'transport', 'housing', 'entertainment', 'shopping', 'health', 'other']
};
// Sample names duplicated from CategorySheet on purpose (no shared scripts between boards).
// <generated:category-names> edit docs/design/canvas/blocks/category-names.block, then yarn design:screens
var CAT = {
  en: { salary: 'Salary', freelance: 'Freelance', gift: 'Gift', investment: 'Investment', food: 'Food', transport: 'Transport', housing: 'Housing', entertainment: 'Entertainment', shopping: 'Shopping', health: 'Health', other: 'Other' },
  fi: { salary: 'Palkka', freelance: 'Freelance', gift: 'Lahja', investment: 'Sijoitus', food: 'Ruoka', transport: 'Liikenne', housing: 'Asuminen', entertainment: 'Viihde', shopping: 'Ostokset', health: 'Terveys', other: 'Muu' },
  ru: { salary: 'Зарплата', freelance: 'Фриланс', gift: 'Подарок', investment: 'Инвестиции', food: 'Еда', transport: 'Транспорт', housing: 'Жильё', entertainment: 'Развлечения', shopping: 'Покупки', health: 'Здоровье', other: 'Другое' }
};
// </generated:category-names>
var STR = {
  en: { title: 'Categories', income: 'Income', expense: 'Expense' },
  fi: { title: 'Kategoriat', income: 'Tulot', expense: 'Menot' },
  ru: { title: 'Категории', income: 'Доходы', expense: 'Расходы' }
};
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = STR[p.lang] ? p.lang : 'en';
    var names = function (type) { return KEYS[type].map(function (k) { return { label: CAT[lang][k] }; }); };
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      lang: lang, s: STR[lang],
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      income: names('income'), expense: names('expense')
    };
  }
}
</script>
</body>
</html>
