<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Period chip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<button type="button" aria-pressed="{{selected}}" class="{{stateClass}}" style="width: 100%; min-width: var(--touch-target); min-height: var(--touch-target); box-sizing: border-box; padding: 0 12px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-family: Roboto, system-ui, sans-serif; font-size: var(--type-body-sm-size); line-height: var(--type-body-sm-line); font-weight: 600; white-space: nowrap; border: 1px solid {{border}}; background: {{bg}}; color: {{fg}}">{{label}}</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Nov"},"selected":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["default","pressed"],"default":"default"},"$preview":{"width":96,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = !!p.selected;
    return {
      label: p.label ?? 'Nov',
      selected: on ? 'true' : 'false',
      stateClass: p.state === 'pressed' ? 'is-pressed' : '',
      border: on ? 'var(--selection)' : 'var(--outline)',
      bg: on ? 'var(--selection)' : 'transparent',
      fg: on ? 'var(--on-action-primary)' : 'var(--text)'
    };
  }
}
</script>
</body>
</html>
