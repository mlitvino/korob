<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Updates</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="drawer" title="{{title}}" lang="{{lang}}" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: var(--gutter); display: flex; flex-direction: column; gap: var(--spacing-lg); overflow: hidden">
    <sc-for list="{{releases}}" as="release" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: var(--spacing-sm)">
        <dc-import name="TransactionDateSeparator" label="{{release.date}}" hint-size="100%,24px"></dc-import>
        <sc-for list="{{release.features}}" as="feature" hint-placeholder-count="3">
          <article style="padding: var(--spacing-lg); border-radius: var(--radius-md); background: var(--canvas); display: flex; flex-direction: column; gap: var(--spacing-xs)">
            <div style="font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 700">{{feature.title}}</div>
            <div class="is-secondary" style="font-size: var(--type-body-sm-size); line-height: var(--type-body-sm-line)">{{feature.howTo}}</div>
          </article>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["global","dark","light","black","black_yellow"],"default":"global"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
var LOCALE = { en: 'en-US', fi: 'fi-FI', ru: 'ru-RU' };
// Only the header follows lang; the entries are Russian in every language.
var TITLE = { en: 'Updates', fi: 'Päivitykset', ru: 'Обновления' };
// Sample entries; the real list is frontend/src/features/updates/changelog.ts (newest first).
var RELEASES = [
  { date: '2026-11-23', features: [
    { title: 'Удаление нескольких транзакций', howTo: 'Удерживайте строку в списке, отметьте нужные транзакции и нажмите корзину. «Выбрать все» отмечает весь список.' },
    { title: 'Комментарий к транзакции', howTo: 'Добавьте комментарий в форме новой транзакции. Нажмите на транзакцию в списке, чтобы увидеть или изменить его.' }
  ] },
  { date: '2026-11-01', features: [
    { title: 'Категории-чипы', howTo: 'Выбирайте категорию или добавляйте новую прямо в окне выбора.' }
  ] }
];
class Component extends DCLogic {
  // <generated:global-theme> edit docs/design/canvas/blocks/global-theme.block, then yarn design:screens
  componentDidMount() {
    // Canvas preview: follow the Global theme board (shared per-app storage).
    var self = this, read = function () {
      var v = null;
      try { v = localStorage.getItem('korob-canvas-global-theme'); } catch (e) { v = null; }
      return ['dark', 'light', 'black', 'black_yellow'].indexOf(v) >= 0 ? v : 'dark';
    };
    this.onGlobal = function () { self.setState({ globalTheme: read() }); };
    this.onStorage = function (e) { if (e.key === 'korob-canvas-global-theme') self.onGlobal(); };
    window.addEventListener('storage', this.onStorage);
    try { this.bc = new BroadcastChannel('korob-canvas-global-theme'); this.bc.onmessage = this.onGlobal; } catch (e) { this.bc = null; }
    this.onGlobal();
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    if (this.bc) this.bc.close();
  }
  globalTheme() { return (this.state && this.state.globalTheme) || 'dark'; }
  // </generated:global-theme>
  renderVals() {
    var p = this.props;
    var lang = TITLE[p.lang] ? p.lang : 'en';
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : this.globalTheme(),
      lang: lang, title: TITLE[lang],
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      releases: RELEASES.map(function (r) {
        return {
          date: new Date(r.date).toLocaleDateString(LOCALE[lang], { day: '2-digit', month: 'long', year: 'numeric' }),
          features: r.features
        };
      })
    };
  }
}
</script>
</body>
</html>
