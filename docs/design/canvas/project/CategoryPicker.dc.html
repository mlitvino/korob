<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Category Picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; position: relative; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="AddExpense" theme="{{theme}}" lang="{{lang}}" width="{{widthStr}}" font-scale="{{fontScale}}" hint-size="412px,892px"></dc-import>
  </div>
  <a href="AddExpense.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></a>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="CategorySheet" kind="expense" selected="food" lang="{{lang}}" href="AddExpense.dc.html" hint-size="100%,544px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","black","black_yellow"],"default":"dark"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var THEMES = ['dark', 'light', 'black', 'black_yellow'];
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      theme: THEMES.indexOf(p.theme) >= 0 ? p.theme : 'dark',
      lang: ['en', 'fi', 'ru'].indexOf(p.lang) >= 0 ? p.lang : 'en',
      width: p.width === '360' ? 360 : 412, widthStr: p.width === '360' ? '360' : '412',
      fontScale: p.fontScale === '1.3' ? '1.3' : '1'
    };
  }
}
</script>
</body>
</html>
