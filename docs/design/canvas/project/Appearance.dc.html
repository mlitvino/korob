<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korob Appearance</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-font-scale="{{fontScale}}" style="width: {{width}}px; height: 892px; display: flex; flex-direction: column; overflow: hidden; font-family: Roboto, system-ui, sans-serif; background: var(--background); color: var(--text)">
  <dc-import name="Header" variant="back" title="{{title}}" href="Settings.dc.html" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column">
    <sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
      <dc-import name="SettingsRow" variant="option" position="{{opt.position}}" selected="{{opt.selected}}" label="{{opt.label}}" hint-size="100%,56px"></dc-import>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","black","black_yellow"],"default":"dark"},"lang":{"editor":"enum","options":["en","fi","ru"],"default":"en"},"width":{"editor":"enum","options":["412","360"],"default":"412"},"fontScale":{"editor":"enum","options":["1","1.3"],"default":"1"},"$preview":{"width":412,"height":892}}'>
var IDS = ['dark', 'light', 'black', 'black_yellow'];
var STR = {
  en: { title: 'Appearance', dark: 'Dark', light: 'Light', black: 'Black', black_yellow: 'Black Yellow' },
  fi: { title: 'Ulkoasu', dark: 'Tumma', light: 'Vaalea', black: 'Musta', black_yellow: 'Musta-keltainen' },
  ru: { title: 'Оформление', dark: 'Тёмная', light: 'Светлая', black: 'Чёрная', black_yellow: 'Чёрно-жёлтая' }
};
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var lang = STR[p.lang] ? p.lang : 'en';
    var theme = IDS.indexOf(p.theme) >= 0 ? p.theme : 'dark';
    return {
      theme: theme, title: STR[lang].title,
      width: p.width === '360' ? 360 : 412,
      fontScale: p.fontScale === '1.3' ? '1.3' : '1',
      options: IDS.map(function (id, i) {
        return { label: STR[lang][id], selected: id === theme, position: i === 0 ? 'first' : i === IDS.length - 1 ? 'last' : 'middle' };
      })
    };
  }
}
</script>
</body>
</html>
